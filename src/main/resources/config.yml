# ─────────────────────────────────────────────────────────────────────────────
#  WGRegionList — дополнительные файлы регионов для WorldGuard
#
#  Регионы лежат в plugins/WGRegionList/regions/<папка>/*.yml (можно с подпапками).
#  Формат файлов такой же, как у regions.yml самого WorldGuard:
#
#    regions:
#      spawn:
#        type: cuboid
#        min: {x: -50, y: -64, z: -50}
#        max: {x: 50, y: 320, z: 50}
#        priority: 10
#        flags: {pvp: deny}
#
#  Регионы самого WorldGuard продолжают работать как обычно и не изменяются.
# ─────────────────────────────────────────────────────────────────────────────

# Привязка папок к мирам.
#   Ключ     — название мира (как папка мира на сервере).
#   Значение — имя папки внутри plugins/WGRegionList/regions/ или список папок.
# Одна папка может принадлежать только одному миру.
worlds:
  world: world
  # world_nether: nether
  # world_the_end:
  #   - end_spawn
  #   - end_arenas

# Сохранение изменений, сделанных в игре, обратно в файлы аддона:
# /rg flag, /rg addmember, /rg addowner, /rg setpriority, /rg setparent, /rg redefine, /rg remove.
# Записываются только изменённые ключи — комментарии и оформление файлов сохраняются.
sync:
  enabled: true
  # Как часто проверять изменения (в секундах). Проверка идёт в отдельном потоке
  # и не нагружает основной поток сервера.
  interval-seconds: 5
  # Удалять регион из файла, если его удалили командой /rg remove.
  # Если false — регион вернётся после перезагрузки аддона.
  delete-removed: true

# Регионы самого WorldGuard могут ссылаться на родителя из файлов аддона.
# WorldGuard при запуске не видит таких родителей и отбрасывает связь —
# эта опция восстанавливает её. Работает только с YAML-хранилищем WorldGuard (по умолчанию).
restore-native-parents: true

# Подробные сообщения в консоли (какие файлы загружены и т.п.).
debug: false
