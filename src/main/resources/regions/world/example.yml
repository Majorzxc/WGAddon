# Пример файла регионов WGRegionList для мира "world".
# Файлов в папке может быть сколько угодно, с любыми именами (*.yml / *.yaml),
# в том числе во вложенных папках. Файлы, имя которых начинается с точки, пропускаются.
#
# Формат такой же, как у plugins/WorldGuard/worlds/<мир>/regions.yml —
# регионы можно просто переносить оттуда (вырезать из WorldGuard и вставить сюда).
# ID регионов не должны повторяться в пределах одного мира — ни между файлами,
# ни с регионами самого WorldGuard (при совпадении приоритет у WorldGuard).
#
# Раскомментируйте пример и выполните /wgrl reload.

